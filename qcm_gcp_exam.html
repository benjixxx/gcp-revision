<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GCP Associate Cloud Engineer (ACE) - Practice Exam QCM</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --correct-bg: #064e3b;
      --correct-border: #10b981;
      --correct-text: #a7f3d0;
      --wrong-bg: #7f1d1d;
      --wrong-border: #ef4444;
      --wrong-text: #fecaca;
      --gcp-blue: #4285f4;
      --gcp-green: #34a853;
      --gcp-yellow: #fbbc05;
      --gcp-red: #ea4335;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #f8fafc 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    /* Dashboard & Score */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      text-align: center;
    }

    .stat-val {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent);
    }

    .stat-lbl {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 0.25rem;
    }

    /* Category filter */
    .filter-container {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      justify-content: center;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      background: #334155;
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 700;
    }

    /* Question Cards */
    .question-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.75rem;
      margin-bottom: 1.75rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -2px rgba(0, 0, 0, 0.2);
      transition: border-color 0.2s;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .q-number {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .q-tag {
      font-size: 0.75rem;
      background: #334155;
      color: #cbd5e1;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-weight: 500;
    }

    .q-title {
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 1.25rem;
      color: #f1f5f9;
    }

    /* Options */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }

    .option-item:hover {
      border-color: #64748b;
      background: #1e293b;
    }

    .option-item.selected {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.05);
    }

    .option-radio {
      margin-top: 0.25rem;
      accent-color: var(--accent);
      width: 1.15rem;
      height: 1.15rem;
      cursor: pointer;
    }

    .option-label {
      font-size: 0.95rem;
      cursor: pointer;
      flex: 1;
    }

    .option-prefix {
      font-weight: 700;
      color: var(--accent);
      margin-right: 0.25rem;
    }

    /* Actions */
    .card-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-validate {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-validate:hover {
      background: #7dd3fc;
      transform: translateY(-1px);
    }

    .btn-validate:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-toggle-exp {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.55rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      display: none; /* revealed after validation */
    }

    .btn-toggle-exp:hover {
      color: var(--text);
      border-color: #64748b;
    }

    /* Status badge after check */
    .answer-status {
      font-size: 0.9rem;
      font-weight: 700;
      display: none;
      align-items: center;
      gap: 0.4rem;
    }

    .status-correct {
      color: var(--correct-border);
    }

    .status-wrong {
      color: var(--wrong-border);
    }

    /* Explanation foldable block */
    .explanation-box {
      margin-top: 1.25rem;
      background: #0b1324;
      border: 1px solid #1e3a5f;
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 1.25rem;
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .exp-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .exp-body {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.6;
    }

    .exp-traps {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px dashed #223854;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .exp-traps strong {
      color: #f87171;
    }

    .exam-tip {
      margin-top: 0.75rem;
      background: rgba(251, 188, 5, 0.1);
      border: 1px solid rgba(251, 188, 5, 0.3);
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #fde047;
    }

    /* State styles after validation */
    .option-item.correct {
      background: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-text) !important;
      font-weight: 600;
    }

    .option-item.wrong {
      background: var(--wrong-bg) !important;
      border-color: var(--wrong-border) !important;
      color: var(--wrong-text) !important;
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .reset-btn {
      background: transparent;
      border: 1px solid #475569;
      color: #cbd5e1;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 1rem;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      background: #334155;
      color: #fff;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo-badge">☁️ Google Cloud Certification Prep</div>
    <h1>Associate Cloud Engineer (ACE) Practice Exam</h1>
    <p class="subtitle">15 realistic exam scenario questions based on official exam patterns and your Terraform project.</p>
  </header>

  <!-- Dashboard -->
  <div class="dashboard">
    <div class="stat-card">
      <div class="stat-val" id="totalQuestions">15</div>
      <div class="stat-lbl">Total Questions</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="answeredCount">0</div>
      <div class="stat-lbl">Answered</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="scoreDisplay">0 / 15</div>
      <div class="stat-lbl">Score</div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filter-container">
    <button class="filter-btn active" onclick="filterCategory('all')">All Questions (15)</button>
    <button class="filter-btn" onclick="filterCategory('compute')">Compute Engine & MIG</button>
    <button class="filter-btn" onclick="filterCategory('storage')">Storage & BigQuery</button>
    <button class="filter-btn" onclick="filterCategory('network')">Networking & Load Balancing</button>
    <button class="filter-btn" onclick="filterCategory('gke')">Kubernetes (GKE)</button>
    <button class="filter-btn" onclick="filterCategory('iam')">IAM, Security & Terraform</button>
  </div>

  <!-- Questions Container -->
  <div id="quizContainer"></div>

  <footer>
    <p>Google Cloud Associate Cloud Engineer Exam Simulator &bull; Interactive Revision</p>
    <button class="reset-btn" onclick="resetQuiz()">🔄 Reset All Answers</button>
  </footer>
</div>

<script>
const questionsData = [
  {
    id: 1,
    category: "network",
    categoryLabel: "Networking & Load Balancing",
    question: "You are designing an external HTTP(S) Load Balancer to distribute incoming internet traffic across backend virtual machine instances. You need to terminate client SSL/TLS connections at the load balancer and route requests to different backend services based on the HTTP request URL path (e.g., '/api' vs '/static'). Which component must you configure on the load balancer to achieve this?",
    options: [
      { id: "A", text: "An SSL Proxy Load Balancer with an SSL policy." },
      { id: "B", text: "An External HTTPS Load Balancer with a Target HTTPS Proxy and a URL map." },
      { id: "C", text: "A TCP Proxy Load Balancer with a Target TCP Proxy." },
      { id: "D", text: "An External Passthrough Network Load Balancer with an SSL certificate." }
    ],
    correct: "B",
    explanation: {
      why: "External HTTPS Load Balancers operate at Layer 7 (Application Layer). They terminate SSL/TLS sessions using a Target HTTPS Proxy (bound to an SSL certificate) and inspect HTTP path headers using a URL Map to direct client requests to distinct backend services.",
      traps: [
        { opt: "A", reason: "SSL Proxy operates at Layer 4 (Transport Layer) for non-HTTP traffic. It terminates SSL but cannot inspect HTTP URL paths." },
        { opt: "C", reason: "TCP Proxy is Layer 4 and does not understand HTTP paths or perform URL-based routing." },
        { opt: "D", reason: "Network Load Balancers are Layer 4 passthrough load balancers; they do not terminate SSL or inspect Layer 7 paths." }
      ],
      examTip: "Exam Keyword: URL path routing ('/video', '/static', '/api') + SSL termination = External HTTPS Load Balancer (Target HTTPS Proxy + URL Map)."
    }
  },
  {
    id: 2,
    category: "storage",
    categoryLabel: "Storage & BigQuery",
    question: "You need to upload a single 32 GB database backup file from an on-premises server to a Cloud Storage bucket over a dedicated 1 Gbps WAN link. Which method will maximize network throughput and complete the upload in the shortest amount of time?",
    options: [
      { id: "A", text: "Upload the file using the Google Cloud Console web interface." },
      { id: "B", text: "Use `gcloud storage` or `gsutil` with parallel composite uploads enabled." },
      { id: "C", text: "Decrease the TCP window size on the source on-premises server." },
      { id: "D", text: "Change the target bucket storage class to Multi-Regional prior to upload." }
    ],
    correct: "B",
    explanation: {
      why: "For a SINGLE very large file (> several GBs), standard sequential single-stream transfer cannot saturate high-bandwidth WAN connections due to single TCP stream latency limits. 'Parallel composite uploads' splits the file locally into chunks, uploads them concurrently across parallel streams to saturate the 1 Gbps link, and recombines them server-side into a single composite object.",
      traps: [
        { opt: "A", reason: "Web console uploads are single-threaded, browser-limited, and unreliable for 32 GB files." },
        { opt: "C", reason: "Decreasing the TCP window size restricts throughput and slows down transfers." },
        { opt: "D", reason: "All Cloud Storage classes (Standard, Nearline, Coldline, Archive) provide the exact same upload throughput and latency." }
      ],
      examTip: "Exam Rule: Multiple files = `gsutil -m cp` (multi-threading) | SINGLE very large file = Parallel composite uploads."
    }
  },
  {
    id: 3,
    category: "storage",
    categoryLabel: "Storage & BigQuery",
    question: "Your company needs to migrate 60 TB of archival data stored in Amazon S3 buckets to Google Cloud Storage on a recurring schedule without consuming any local on-premises network bandwidth. Which service should you use?",
    options: [
      { id: "A", text: "Run `gsutil -m cp` from an administrator laptop connected via VPN." },
      { id: "B", text: "Order a physical Google Cloud Transfer Appliance." },
      { id: "C", text: "Use Storage Transfer Service (STS)." },
      { id: "D", text: "Build a Cloud Data Fusion batch pipeline." }
    ],
    correct: "C",
    explanation: {
      why: "Storage Transfer Service (STS) is a fully managed, serverless Google Cloud service specifically designed for large-scale cloud-to-cloud data transfers (Amazon S3, Azure Blob Storage, or Cloud Storage bucket-to-bucket). It transfers data directly over high-speed cloud backbones without routing through your local workstations or consuming on-premises bandwidth.",
      traps: [
        { opt: "A", reason: "Running gsutil locally routes all 60 TB through the administrator's local machine and VPN connection." },
        { opt: "B", reason: "Transfer Appliance is a physical high-capacity storage device shipped by courier for on-premises datacenters with limited internet bandwidth." },
        { opt: "D", reason: "Cloud Data Fusion is an ETL data transformation tool, excessively complex and expensive for simple bucket migration." }
      ],
      examTip: "Exam Keyword: Amazon S3 to GCS / Cloud-to-Cloud large-scale migration = Storage Transfer Service (STS)."
    }
  },
  {
    id: 4,
    category: "compute",
    categoryLabel: "Compute Engine & MIG",
    question: "You manage a Managed Instance Group (MIG) configured with an autoscaler based on target CPU utilization (80%). The web application takes 3 minutes (180 seconds) to boot, warm up caches, and begin serving traffic. The health check initial delay is currently set to 30 seconds. During sudden traffic spikes, the autoscaler creates too many instances, and newly launched instances are repeatedly marked unhealthy and killed before they finish starting. How should you resolve this issue?",
    options: [
      { id: "A", text: "Limit the maximum number of instances in the MIG to 3." },
      { id: "B", text: "Increase the Health Check initial delay (cool-down period) to at least 200 seconds." },
      { id: "C", text: "Replace the HTTP health check with a TCP health check." },
      { id: "D", text: "Change the autoscaling metric from CPU utilization to HTTP request latency." }
    ],
    correct: "B",
    explanation: {
      why: "The Health Check 'Initial delay' (cool-down period) specifies how long the auto-healer and autoscaler must wait after VM launch before evaluating health and CPU metrics. If the app takes 180s to boot but the initial delay is 30s, the health check fails while the VM is still initializing, causing the MIG to terminate the instance prematurely and spawn excessive replacements. Setting it to 200s allows VMs to start up cleanly.",
      traps: [
        { opt: "A", reason: "Artificially capping instance count prevents necessary scaling and degrades service availability under peak load." },
        { opt: "C", reason: "A TCP health check only verifies that the port is open; it doesn't give the application runtime time to warm up." },
        { opt: "D", reason: "Changing metric does not fix the root cause: premature health check failures during instance initialization." }
      ],
      examTip: "Exam Keyword: Application takes X minutes to initialize = Set Health Check Initial Delay (cool-down) > X minutes."
    }
  },
  {
    id: 5,
    category: "compute",
    categoryLabel: "Compute Engine & MIG",
    question: "You run a nightly batch data processing job that takes approximately 2 hours to execute. The workload is fault-tolerant and saves state to checkpoints every 10 minutes. Which Compute Engine option offers the lowest cost for this workload?",
    options: [
      { id: "A", text: "Standard on-demand Compute Engine VMs." },
      { id: "B", text: "Spot VMs (Preemptible VMs)." },
      { id: "C", text: "Sole-tenant nodes." },
      { id: "D", text: "Compute Engine instances with a 3-year Committed Use Discount (CUD)." }
    ],
    correct: "B",
    explanation: {
      why: "Spot VMs (and Preemptible VMs) provide 60% to 91% discounts compared to standard VM pricing. Because the job runs for only 2 hours and is fault-tolerant with checkpoints, potential preemption by Google Cloud poses no risk, maximizing cost savings.",
      traps: [
        { opt: "A", reason: "Standard on-demand instances run at full price without the deep Spot discounts." },
        { opt: "C", reason: "Sole-tenant nodes are dedicated physical servers, which are the most expensive compute offering." },
        { opt: "D", reason: "Committed Use Discounts require paying continuously 24/7 for 1 or 3 years, making them uneconomical for a 2-hour daily batch." }
      ],
      examTip: "Exam Keyword: Fault-tolerant / Batch job + Maximum cost savings = Spot VMs (Preemptible)."
    }
  },
  {
    id: 6,
    category: "network",
    categoryLabel: "Networking & Load Balancing",
    question: "You want to host public DNS records for your domain `shop.example.com` using Google Cloud DNS. Before you can create public record sets (such as A and CNAME records) that resolve on the internet, which initial step must you complete?",
    options: [
      { id: "A", text: "Create a public Cloud DNS managed zone for `example.com` and update the registrar's name servers to point to Google Cloud's authoritative name servers." },
      { id: "B", text: "Create a private Cloud DNS managed zone and link it to your default VPC network." },
      { id: "C", text: "Deploy an internal DNS proxy on a Compute Engine instance." },
      { id: "D", text: "Request an SSL certificate from Google Certificate Manager for `shop.example.com`." }
    ],
    correct: "A",
    explanation: {
      why: "To resolve public DNS queries through Cloud DNS, you must first create a public managed zone in GCP and delegate domain authority by updating the registrar's NS (Name Server) records to point to Google's assigned Cloud DNS name servers.",
      traps: [
        { opt: "B", reason: "Private zones are only resolvable internally by authorized VPC networks, not on the public internet." },
        { opt: "C", reason: "No custom DNS proxy is required; Cloud DNS is a globally distributed, fully managed service." },
        { opt: "D", reason: "SSL certificates handle HTTPS encryption, not public DNS domain resolution." }
      ],
      examTip: "Exam Workflow: Public DNS resolution = Create Public Managed Zone -> Copy NS records -> Paste into Domain Registrar."
    }
  },
  {
    id: 7,
    category: "compute",
    categoryLabel: "Compute Engine & MIG",
    question: "You deployed version `v2` of a web application to App Engine standard environment. Immediately after deployment, users encounter 500 errors. You need to roll back all traffic to the previous working version `v1` immediately with zero downtime. What should you do?",
    options: [
      { id: "A", text: "Execute `gcloud app restore --version=v1`." },
      { id: "B", text: "In the Google Cloud Console, navigate to App Engine > Versions, select `v1`, and route 100% of the traffic to it." },
      { id: "C", text: "Delete the App Engine application and re-create it from source control." },
      { id: "D", text: "Run `gcloud app deploy` again from your local terminal to re-upload `v1`." }
    ],
    correct: "B",
    explanation: {
      why: "App Engine keeps previous versions deployed and running in the background unless explicitly stopped or deleted. Rolling back takes seconds: navigate to the Versions page and route 100% of traffic back to `v1` (or run `gcloud app services set-traffic default --splits v1=1`).",
      traps: [
        { opt: "A", reason: "The command `gcloud app restore` does not exist." },
        { opt: "C", reason: "Deleting an App Engine application causes major downtime and wipes out all settings." },
        { opt: "D", reason: "Redeploying from scratch takes several minutes for building and container packaging, whereas traffic splitting is instantaneous." }
      ],
      examTip: "Exam Keyword: App Engine instant rollback = Route 100% traffic to previous version in App Engine Versions tab."
    }
  },
  {
    id: 8,
    category: "compute",
    categoryLabel: "Compute Engine & MIG",
    question: "You are hosting a critical enterprise application on Compute Engine. You must ensure that scheduled physical host hardware and hypervisor maintenance performed by Google in the datacenter does not cause any downtime for your virtual machines. Which VM configuration should you verify?",
    options: [
      { id: "A", text: "Set 'On-host maintenance' to 'Terminate VM instance'." },
      { id: "B", text: "Set 'On-host maintenance' to 'Migrate VM instance' (Live Migration)." },
      { id: "C", text: "Set 'Automatic restart' to 'Off'." },
      { id: "D", text: "Assign a reserved static external IP address to the instance." }
    ],
    correct: "B",
    explanation: {
      why: "Compute Engine provides Live Migration ('Migrate VM instance'). When Google conducts infrastructure maintenance on physical servers, the running VM is seamlessly migrated to a different physical host without rebooting, interrupting network connections, or causing downtime.",
      traps: [
        { opt: "A", reason: "'Terminate' stops the VM during host maintenance, causing an outage." },
        { opt: "C", reason: "'Automatic restart: Off' prevents the instance from booting back up after a physical node failure." },
        { opt: "D", reason: "Static IP retains IP addressing but does not prevent hardware maintenance reboots." }
      ],
      examTip: "Exam Keyword: Zero-downtime physical host maintenance = On-host maintenance: Migrate (Live Migration)."
    }
  },
  {
    id: 9,
    category: "storage",
    categoryLabel: "Storage & BigQuery",
    question: "Users report that when clicking on PDF documents hosted in a public Cloud Storage bucket, web browsers automatically download the file instead of rendering and previewing it in the browser. What is the root cause and how should you fix it?",
    options: [
      { id: "A", text: "The bucket storage class is Coldline instead of Standard." },
      { id: "B", text: "The objects were uploaded with the `Content-Type` metadata set to `application/octet-stream` instead of `application/pdf`." },
      { id: "C", text: "Cloud CDN is serving a cached HTTP 403 Forbidden response." },
      { id: "D", text: "The Cloud Storage bucket lacks an attached custom SSL certificate." }
    ],
    correct: "B",
    explanation: {
      why: "Web browsers determine how to display web assets based on the HTTP `Content-Type` header sent by Cloud Storage. When files are uploaded without specifying a MIME type, tools often default to `application/octet-stream` (binary stream), forcing the browser to trigger a download. Updating metadata to `Content-Type: application/pdf` allows the browser's built-in PDF reader to display it inline.",
      traps: [
        { opt: "A", reason: "Storage classes impact pricing and retrieval frequency, never HTTP MIME headers." },
        { opt: "C", reason: "The file is downloading successfully, which proves there is no 403 access denial." },
        { opt: "D", reason: "Cloud Storage native URLs (*.storage.googleapis.com) automatically use Google wildcard SSL certificates." }
      ],

let userAnswers = {};
let validatedQuestions = {};
let currentFilter = 'all';

function initQuiz() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';

  questionsData.forEach(q => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `qCard_${q.id}`;
    card.setAttribute('data-category', q.category);

    const optionsHtml = q.options.map(opt => `
      <div class="option-item" id="optItem_${q.id}_${opt.id}" onclick="selectOption(${q.id}, '${opt.id}')">
        <input type="radio" class="option-radio" name="q_${q.id}" id="radio_${q.id}_${opt.id}" value="${opt.id}" onclick="event.stopPropagation(); selectOption(${q.id}, '${opt.id}')">
        <label class="option-label" for="radio_${q.id}_${opt.id}">
          <span class="option-prefix">${opt.id}.</span> ${escapeHtml(opt.text)}
        </label>
      </div>
    `).join('');

    const trapsHtml = q.explanation.traps.map(trap => `
      <p style="margin-top: 0.35rem;"><strong>Option ${trap.opt}:</strong> ${escapeHtml(trap.reason)}</p>
    `).join('');

    card.innerHTML = `
      <div class="card-top">
        <span class="q-number">Question ${q.id} / 15</span>
        <span class="q-tag">${escapeHtml(q.categoryLabel)}</span>
      </div>
      <div class="q-title">${escapeHtml(q.question)}</div>
      
      <div class="options-list">
        ${optionsHtml}
      </div>

      <div class="card-actions">
        <button class="btn-validate" id="btnVal_${q.id}" onclick="validateAnswer(${q.id})" disabled>Check Answer</button>
        <button class="btn-toggle-exp" id="btnToggle_${q.id}" onclick="toggleExplanation(${q.id})">💡 Reveal Explanation</button>
        <span class="answer-status" id="status_${q.id}"></span>
      </div>

      <div class="explanation-box" id="expBox_${q.id}">
        <div class="exp-title">📘 Detailed Solution & Analysis</div>
        <div class="exp-body">
          <p><strong>Correct Answer: Option ${q.correct}</strong></p>
          <p style="margin-top: 0.5rem;">${escapeHtml(q.explanation.why)}</p>
        </div>
        <div class="exp-traps">
          <div style="font-weight: 700; color: #fca5a5; margin-bottom: 0.3rem;">⚠️ Why the other options are distractors:</div>
          ${trapsHtml}
        </div>
        <div class="exam-tip">
          🎯 <strong>Exam Reflex:</strong> ${escapeHtml(q.explanation.examTip)}
        </div>
      </div>
    `;

    container.appendChild(card);
  });

  updateStats();
}

function selectOption(qId, optId) {
  if (validatedQuestions[qId]) return; // locked after validation

  userAnswers[qId] = optId;

  // Update UI selection
  const qData = questionsData.find(q => q.id === qId);
  qData.options.forEach(opt => {
    const item = document.getElementById(`optItem_${qId}_${opt.id}`);
    const radio = document.getElementById(`radio_${qId}_${opt.id}`);
    if (opt.id === optId) {
      item.classList.add('selected');
      radio.checked = true;
    } else {
      item.classList.remove('selected');
      radio.checked = false;
    }
  });

  // Enable validate button
  document.getElementById(`btnVal_${qId}`).disabled = false;
}

function validateAnswer(qId) {
  const selectedOpt = userAnswers[qId];
  if (!selectedOpt) return;

  const qData = questionsData.find(q => q.id === qId);
  const isCorrect = (selectedOpt === qData.correct);

  validatedQuestions[qId] = isCorrect;

  // Highlight options
  qData.options.forEach(opt => {
    const item = document.getElementById(`optItem_${qId}_${opt.id}`);
    const radio = document.getElementById(`radio_${qId}_${opt.id}`);
    radio.disabled = true;

    if (opt.id === qData.correct) {
      item.classList.add('correct');
    } else if (opt.id === selectedOpt && !isCorrect) {
      item.classList.add('wrong');
    }
  });

  // Update button and status
  const btnVal = document.getElementById(`btnVal_${qId}`);
  btnVal.disabled = true;
  btnVal.style.display = 'none';

  const statusSpan = document.getElementById(`status_${qId}`);
  statusSpan.style.display = 'inline-flex';
  if (isCorrect) {
    statusSpan.className = 'answer-status status-correct';
    statusSpan.innerHTML = '✅ Correct!';
  } else {
    statusSpan.className = 'answer-status status-wrong';
    statusSpan.innerHTML = `❌ Incorrect (Correct was: Option ${qData.correct})`;
  }

  // Show toggle explanation button and reveal explanation automatically
  const btnToggle = document.getElementById(`btnToggle_${qId}`);
  btnToggle.style.display = 'inline-block';
  
  toggleExplanation(qId, true);
  updateStats();
}

function toggleExplanation(qId, forceOpen = false) {
  const box = document.getElementById(`expBox_${qId}`);
  const btn = document.getElementById(`btnToggle_${qId}`);
  if (forceOpen || box.style.display !== 'block') {
    box.style.display = 'block';
    btn.innerText = '🔽 Hide Explanation';
  } else {
    box.style.display = 'none';
    btn.innerText = '💡 Reveal Explanation';
  }
}

function updateStats() {
  const answeredCount = Object.keys(validatedQuestions).length;
  let correctCount = 0;
  for (const qId in validatedQuestions) {
    if (validatedQuestions[qId] === true) correctCount++;
  }

  document.getElementById('answeredCount').innerText = answeredCount;
  document.getElementById('scoreDisplay').innerText = `${correctCount} / 15`;
}

function filterCategory(cat) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');

  questionsData.forEach(q => {
    const card = document.getElementById(`qCard_${q.id}`);
    if (!card) return;
    if (cat === 'all' || q.category === cat) {
      card.style.display = 'block';
    } else {
      card.style.display = 'none';
    }
  });
}

function resetQuiz() {
  if (confirm("Reset all your answers and restart the test?")) {
    userAnswers = {};
    validatedQuestions = {};
    initQuiz();
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// Initial launch
initQuiz();
</script>
