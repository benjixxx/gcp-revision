name: Build & Push QualityAirApp to GCP Artifact Registry

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'qualityAirApp/app.py'
      - 'qualityAirApp/templates/**'
      - 'qualityAirApp/static/**'
      - 'qualityAirApp/requirements.txt'
      - 'qualityAirApp/Dockerfile'
      - '.github/workflows/quality-air-ci.yml'
  workflow_dispatch:

env:
  PROJECT_ID: myproject-329912
  REGION: europe-west1
  GAR_REPO: quality-air-repo
  IMAGE_NAME: quality-air-app

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Authenticate to Google Cloud (100% Keyless Workload Identity Federation)
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: 'github-actions-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      # Install & Configure Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Configure Docker with Artifact Registry credentials
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Build and Push Docker Image
      - name: Build and Push Docker Image
        working-directory: ./qualityAirApp
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}"
          TAG="${{ github.sha }}"
          SHORT_SHA=$(echo "${TAG}" | cut -c1-7)

          echo "Building image: ${IMAGE_URI}:${SHORT_SHA}"
          docker build \
            -t "${IMAGE_URI}:${SHORT_SHA}" \
            -t "${IMAGE_URI}:latest" \
            .

          echo "Pushing image tags to Artifact Registry..."
          docker push "${IMAGE_URI}:${SHORT_SHA}"
          docker push "${IMAGE_URI}:latest"

          echo "=== Successfully pushed container image ==="
          echo "Image URI: ${IMAGE_URI}:${SHORT_SHA}"

