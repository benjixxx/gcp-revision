name: Build, Push & Deploy QualityAirApp to GKE

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'qualityAirApp/**'
      - '.github/workflows/k8s-deployment.yml'
  workflow_dispatch:

env:
  PROJECT_ID: myproject-329912
  REGION: europe-west1
  ZONE: europe-west1-b
  CLUSTER_NAME: main-gke-cluster
  GAR_REPO: quality-air-repo
  IMAGE_NAME: quality-air-app
  NAMESPACE: quality-air

jobs:
  build-and-deploy:
    name: Build Image & Deploy to GKE
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate to GCP (100% Keyless Workload Identity Federation)
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: 'github-actions-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      # 3. Setup Google Cloud CLI
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 4. Authenticate kubectl to GKE (installs gke-gcloud-auth-plugin automatically)
      - name: Get GKE Cluster Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.ZONE }}

      # 5. Configure Docker authentication for Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 6. Build and Push Docker image (tagged with short Git SHA and :latest)
      - name: Build and Push Docker Image
        working-directory: ./qualityAirApp
        run: |
          IMAGE_BASE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          echo "Building image: ${IMAGE_BASE}:${SHORT_SHA}"
          docker build \
            -t "${IMAGE_BASE}:${SHORT_SHA}" \
            -t "${IMAGE_BASE}:latest" \
            .

          echo "Pushing image tags to Artifact Registry..."
          docker push "${IMAGE_BASE}:${SHORT_SHA}"
          docker push "${IMAGE_BASE}:latest"

          echo "IMAGE_TAGGED=${IMAGE_BASE}:${SHORT_SHA}" >> $GITHUB_ENV

      # 7. Ensure Namespace exists
      - name: Ensure Target Namespace
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      # 8. Deploy / Update Kubernetes Manifests (Deployment, Service, HPA)
      - name: Deploy Manifests to GKE
        run: |
          kubectl apply -k ./qualityAirApp/k8s/

      # 9. Update Deployment Image to the newly pushed immutable commit SHA
      - name: Update Deployment Image
        run: |
          kubectl set image deployment/quality-air-app quality-air-app="${{ env.IMAGE_TAGGED }}" -n ${{ env.NAMESPACE }}

      # 10. Wait for Zero-Downtime Rollout to Complete
      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/quality-air-app -n ${{ env.NAMESPACE }} --timeout=180s

      # 11. Display Cluster Status & External IP
      - name: Display Deployment Status
        run: |
          echo "=== Pods in namespace '${{ env.NAMESPACE }}' ==="
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide

          echo "=== Services in namespace '${{ env.NAMESPACE }}' ==="
          kubectl get svc -n ${{ env.NAMESPACE }}

          echo "=== Horizontal Pod Autoscaler ==="
          kubectl get hpa -n ${{ env.NAMESPACE }}

