apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: opentelemetry
  labels:
    app.kubernetes.io/name: otel-collector
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      kubeletstats:
        endpoint: "https://${env:HOST_IP}:10250"
        auth_type: "serviceAccount"
        insecure_skip_verify: true
        collection_interval: 20s
        metric_groups:
          - node
          - pod
          - container
        metrics:
          k8s.pod.cpu.utilization:
            enabled: false

      hostmetrics:
        root_path: /hostfs
        collection_interval: 30s
        scrapers:
          cpu: {}
          disk: {}
          filesystem:
            exclude_mount_points:
              match_type: regexp
              mount_points:
                - "^/dev.*"
                - "^/proc.*"
                - "^/sys.*"
                - "^/run.*"
                - "^/var/lib/docker/.*"
                - "^/var/lib/kubelet/.*"
          load: {}
          memory: {}
          network: {}

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20

      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: false
        filter:
          node_from_env_var: "K8S_NODE_NAME"
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.container.name

      resourcedetection:
        detectors: [gcp, env]
        timeout: 2s

      resource:
        attributes:
          - key: k8s.cluster.name
            value: "main-gke-cluster"
            action: insert
          - key: cloud.platform
            value: "gcp_kubernetes_engine"
            action: insert

      batch:
        send_batch_size: 8192
        timeout: 5s

    exporters:
      googlecloud:
        project: "myproject-329912"
        trace:
          endpoint: "cloudtrace.googleapis.com"
        metric:
          prefix: "custom.googleapis.com"

      debug:
        verbosity: basic

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resourcedetection, resource, batch]
          exporters: [googlecloud, debug]
        metrics:
          receivers: [otlp, kubeletstats, hostmetrics]
          processors: [memory_limiter, k8sattributes, resourcedetection, resource, batch]
          exporters: [googlecloud, debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resourcedetection, resource, batch]
          exporters: [debug]
      telemetry:
        logs:
          level: info
        metrics:
          address: 0.0.0.0:8888

