apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: quality-air-instrumentation
  namespace: quality-air
  labels:
    app.kubernetes.io/name: quality-air-instrumentation
    app.kubernetes.io/part-of: opentelemetry
spec:
  # Route traces through the in-cluster OpenTelemetry Collector DaemonSet
  exporter:
    endpoint: http://otel-collector.opentelemetry.svc.cluster.local:4318
  propagators:
    - tracecontext
    - baggage
    - b3
  sampler:
    type: always_on # 100% trace sampling for full visibility
  python:
    env:
      - name: OTEL_EXPORTER_OTLP_INSECURE
        value: "true"
      - name: OTEL_PYTHON_LOG_CORRELATION
        value: "true"
