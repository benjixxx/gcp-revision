apiVersion: apps/v1
kind: Deployment
metadata:
  name: quality-air-app
  namespace: quality-air
  labels:
    app: quality-air-app
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Spin up 1 new pod before taking down an old one
      maxUnavailable: 0  # Never drop capacity during upgrades (Zero-Downtime)
  selector:
    matchLabels:
      app: quality-air-app
  template:
    metadata:
      labels:
        app: quality-air-app
        tier: frontend
      annotations:
        # OpenTelemetry auto-instrumentation for Python
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      containers:
      - name: quality-air-app
        # Update this tag when releasing new versions (e.g., :1.0.0, :1.0.1, or Git short SHA)
        image: europe-west1-docker.pkg.dev/myproject-329912/quality-air-repo/quality-air-app:1.0.1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: OTEL_SERVICE_NAME
          value: "quality-air-app"
        resources:
          requests:
            cpu: "50m"       # Base request for Gunicorn + OpenTelemetry
            memory: "128Mi"  # Sufficient memory for multi-worker Python runtime
          limits:
            cpu: "300m"      # Higher ceiling to prevent CPU throttling on TLS/HTTPS
            memory: "256Mi"  # Prevents OOMKilled caused by OpenTelemetry overhead
        # Readiness Probe: Traffic won't be sent to this pod until /health returns HTTP 200
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # Liveness Probe: Tolerant to traffic bursts to prevent CrashLoopBackOff kills
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 5

