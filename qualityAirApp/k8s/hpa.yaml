apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quality-air-hpa
  namespace: quality-air
  labels:
    app: quality-air-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quality-air-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50

