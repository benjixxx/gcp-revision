apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quality-air-hpa
  namespace: quality-air
  labels:
    app: quality-air-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quality-air-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
    target:
      type: Utilization
      averageUtilization: 60
  - type: Resource
    resource:
      name: memory
    target:
      type: Utilization
      averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      # 60s stabilization window prevents flapping during traffic bursts
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max
