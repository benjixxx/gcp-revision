name: Build & Push QualityAirApp to GCP Artifact Registry

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'qualityAirApp/VERSION'
      - 'qualityAirApp/app.py'
      - 'qualityAirApp/templates/**'
      - 'qualityAirApp/static/**'
      - 'qualityAirApp/requirements.txt'
      - 'qualityAirApp/Dockerfile'
      - '.github/workflows/quality-air-ci.yml'
  workflow_dispatch:

env:
  PROJECT_ID: myproject-329912
  REGION: europe-west1
  GAR_REPO: quality-air-repo
  IMAGE_NAME: quality-air-app
  GCS_BUCKET: quality-air-app

jobs:
  build-and-push:
    name: Build, Push Container & Sync GCS Bucket
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Authenticate to Google Cloud (100% Keyless Workload Identity Federation)
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: 'github-actions-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      # Install & Configure Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Configure Docker with Artifact Registry credentials
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Compute Dynamic Semantic Version
      - name: Compute Semantic Version
        id: semver
        run: |
          BASE_VERSION=$(cat qualityAirApp/VERSION 2>/dev/null | tr -d '[:space:]' || echo "1.0.0")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          
          # Auto-increment patch based on GitHub Run Number:
          # Run 1 produces 1.0.0, Run 2 produces 1.0.1, etc.
          RUN_INDEX=$((${GITHUB_RUN_NUMBER:-1} - 1))
          AUTO_PATCH=$((PATCH + RUN_INDEX))
          VERSION="${MAJOR}.${MINOR}.${AUTO_PATCH}"
          SHORT_SHA=$(echo "${GITHUB_SHA:-latest}" | cut -c1-7)

          echo "Base Version: ${BASE_VERSION}"
          echo "Auto-incremented Version: ${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      # Build and Push Docker Image
      - name: Build and Push Docker Image
        working-directory: ./qualityAirApp
        run: |
          VERSION="${{ steps.semver.outputs.version }}"
          SHORT_SHA="${{ steps.semver.outputs.short_sha }}"
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}"

          echo "Building image with Version: ${VERSION} (${IMAGE_URI}:${VERSION})"
          docker build \
            --build-arg APP_VERSION="${VERSION}" \
            -t "${IMAGE_URI}:${VERSION}" \
            -t "${IMAGE_URI}:${SHORT_SHA}" \
            -t "${IMAGE_URI}:latest" \
            .

          echo "Pushing image tags to Artifact Registry (${VERSION}, ${SHORT_SHA}, latest)..."
          docker push "${IMAGE_URI}:${VERSION}"
          docker push "${IMAGE_URI}:${SHORT_SHA}"
          docker push "${IMAGE_URI}:latest"

          echo "=== Successfully pushed container image ==="
          echo "Image Version URI: ${IMAGE_URI}:${VERSION}"

      # Sync Application Files to Cloud Storage Bucket (for Compute Engine VMs & backups)
      - name: Sync Application Files to Cloud Storage
        run: |
          echo "=== Syncing app files to gs://${{ env.GCS_BUCKET }}/qualityAirApp ==="
          gcloud storage cp qualityAirApp/app.py gs://${{ env.GCS_BUCKET }}/qualityAirApp/app.py
          gcloud storage cp qualityAirApp/requirements.txt gs://${{ env.GCS_BUCKET }}/qualityAirApp/requirements.txt
          gcloud storage cp -r qualityAirApp/templates gs://${{ env.GCS_BUCKET }}/qualityAirApp/
          if [ -d "qualityAirApp/static" ]; then
            gcloud storage cp -r qualityAirApp/static gs://${{ env.GCS_BUCKET }}/qualityAirApp/
          fi
          echo "=== Successfully updated application files in gs://${{ env.GCS_BUCKET }}/qualityAirApp ==="
