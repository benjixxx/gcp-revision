name: Deploy QualityAirApp to GKE

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'qualityAirApp/k8s/**'
      - '.github/workflows/k8s-deployment.yml'
      - 'qualityAirApp/ci/k8s-deployment.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to pull from Artifact Registry'
        required: false
        default: 'latest'

env:
  PROJECT_ID: myproject-329912
  REGION: europe-west1
  ZONE: europe-west1-b
  CLUSTER_NAME: main-gke-cluster
  GAR_REPO: quality-air-repo
  IMAGE_NAME: quality-air-app
  NAMESPACE: quality-air

jobs:
  deploy-to-gke:
    name: Deploy Image from Artifact Registry to GKE
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation

    steps:
      # 1. Checkout repository manifests
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate to Google Cloud (100% Keyless Workload Identity Federation)
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: 'github-actions-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      # 3. Setup Google Cloud CLI
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 4. Authenticate kubectl to GKE (automatically installs gke-gcloud-auth-plugin)
      - name: Get GKE Cluster Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.ZONE }}

      # 5. Ensure target namespace exists
      - name: Ensure Target Namespace
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      # 6. Apply Kubernetes Manifests (Deployment, Service, HPA)
      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -k ./qualityAirApp/k8s/

      # 7. Set Deployment to pull image from Artifact Registry & trigger rolling restart
      - name: Deploy Image from Artifact Registry
        run: |
          TAG="${{ inputs.image_tag }}"
          TAG="${TAG:-latest}"
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${TAG}"

          echo "Configuring deployment to use Artifact Registry image: ${IMAGE_URI}"
          kubectl set image deployment/quality-air-app quality-air-app="${IMAGE_URI}" -n ${{ env.NAMESPACE }}

          # Trigger zero-downtime rolling restart to fetch the latest image digest
          kubectl rollout restart deployment/quality-air-app -n ${{ env.NAMESPACE }}

      # 8. Verify Zero-Downtime Rollout Completion
      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/quality-air-app -n ${{ env.NAMESPACE }} --timeout=180s

      # 9. Display Live Cluster Status & Service External IP
      - name: Display Cluster Status
        run: |
          echo "=== Running Pods in '${{ env.NAMESPACE }}' ==="
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide

          echo "=== Services & Load Balancer External IP ==="
          kubectl get svc -n ${{ env.NAMESPACE }}

          echo "=== Horizontal Pod Autoscaler (HPA) ==="
          kubectl get hpa -n ${{ env.NAMESPACE }}
