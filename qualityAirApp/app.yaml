# ==============================================================================
# Google App Engine (Standard Environment) Configuration
# ==============================================================================
runtime: python311
instance_class: F1

# Gunicorn entrypoint pointing to the 'app' Flask instance inside app.py
entrypoint: gunicorn --workers 3 --bind :$PORT app:app

# Routing handlers (static assets if any, and Python WSGI application)
handlers:
  - url: /static
    static_dir: static

  - url: /.*
    script: auto

# Environment variables
env_variables:
  APP_ENV: "production"
  PYTHONUNBUFFERED: "1"

# Automatic scaling (scales down to 0 instances when idle to minimize costs)
automatic_scaling:
  min_instances: 0
  max_instances: 3
  target_cpu_utilization: 0.70
